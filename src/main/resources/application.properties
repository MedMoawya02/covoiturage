# ===== Application =====
spring.application.name=covoiturage
server.port=8080

# ===== DataSource PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/covoiturage
spring.datasource.username=covoiturage
spring.datasource.password=covoiturage
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# ===== Jackson (LocalDateTime formaté) =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Springdoc / Swagger UI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Logs =====
logging.level.com.example.covoiturage=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE